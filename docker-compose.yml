services:
  mediasort:
    image: ghcr.io/maxbrechtel/mediasort:latest
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: Europe/Berlin
      MEDIASORT_PORT: ${MEDIASORT_PORT:-8080}
    ports:
      - "${MEDIASORT_PORT:-8080}:${MEDIASORT_PORT:-8080}"
    volumes:
      - ./config:/config
      - /media:/media
    restart: unless-stopped
