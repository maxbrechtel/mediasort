# mediasort + arr-Stack hinter ExpressVPN (Gluetun)
#
# Alle Container teilen sich das Netzwerk von "gluetun". Fällt der VPN aus,
# blockiert Gluetun jeden Verkehr nach außen (Killswitch).
# Ports werden deshalb nur bei gluetun veröffentlicht; untereinander erreichen
# sich die Programme über localhost.
#
# Zugangsdaten und Netz stehen in .env (Vorlage: .env.example).

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=expressvpn
      - OPENVPN_USER=${EXPRESSVPN_USER}
      - OPENVPN_PASSWORD=${EXPRESSVPN_PASSWORD}
      - SERVER_COUNTRIES=${VPN_COUNTRY:-Germany}
      - FIREWALL_OUTBOUND_SUBNETS=${HOME_SUBNET}
      - TZ=Europe/Berlin
    ports:
      - 8080:8080   # SABnzbd
      - 8090:8090   # mediasort
      - 8989:8989   # Sonarr
      - 7878:7878   # Radarr
      - 9696:9696   # Prowlarr
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: "service:gluetun"
    depends_on: [gluetun]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Berlin
    volumes:
      - ./sabnzbd:/config
      - /media:/media
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on: [gluetun]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Berlin
    volumes:
      - ./prowlarr:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    depends_on: [gluetun]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Berlin
    volumes:
      - ./sonarr:/config
      - /media:/media
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    depends_on: [gluetun]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Berlin
    volumes:
      - ./radarr:/config
      - /media:/media
    restart: unless-stopped

  mediasort:
    image: ghcr.io/maxbrechtel/mediasort:latest
    container_name: mediasort
    network_mode: "service:gluetun"
    depends_on: [gluetun]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=Europe/Berlin
      - MEDIASORT_PORT=8090   # 8080 belegt SABnzbd im gemeinsamen Netzwerk
    volumes:
      - ./mediasort:/config
      - /media:/media
    restart: unless-stopped
