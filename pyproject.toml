[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediasort"
version = "0.1.0"
description = "Sortiert Film- und Serien-Dateien anhand von TMDB"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "sqlalchemy>=2",
    "httpx",
    "guessit",
    "babelfish",
    "rapidfuzz",
]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout"]

[project.scripts]
mediasort = "mediasort.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
