<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mediasort{% endblock %} – mediasort</title>
  <!-- Fehlerantworten 400/409/502 enthalten deutsche Meldungen und werden wie Erfolge eingesetzt -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"^(400|409|502)$","swap":true,"error":true},{"code":"[45]..","swap":false,"error":true}]}'>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">mediasort</a>
    <nav>
      {% for href, label in [("/", "Übersicht"), ("/review", "Prüfliste"), ("/library", "Bibliothek prüfen"),
                             ("/history", "Verlauf"), ("/ignored", "Ignoriert"), ("/settings", "Einstellungen")] %}
      <a href="{{ href }}"{% if active == href %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
